<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100d">
  <title>K typer // Terminal</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="terminal">
    <header class="panel masthead">
      <div>
        <p class="eyebrow">BESTIAIRE // TERMINAL 01</p>
        <h1>K <span>TYPER</span></h1>
      </div>
      <div class="essence">
        <p class="eyebrow">ESSENCE</p>
        <strong id="essence-value">0</strong>
        <span id="rate-value" class="rate">+0/s</span>
      </div>
    </header>

    <div id="notice" class="panel notice" hidden>
      <p id="notice-text"></p>
      <button id="notice-close" class="button" type="button">OK</button>
    </div>

    <section id="quest" class="panel quest" aria-label="Objectif">
      <div class="quest-body">
        <p id="quest-step" class="eyebrow"></p>
        <p id="quest-text" class="quest-text"></p>
        <p id="quest-hint" class="muted"></p>
        <div class="progress"><span id="quest-bar"></span></div>
      </div>
      <button id="quest-claim" class="button button-amber" type="button" disabled></button>
    </section>

    <section class="panel word-panel" aria-label="Zone de mots">
      <div class="word-head">
        <span id="combo-text" class="combo-text"></span>
        <div class="progress combo-progress"><span id="combo-bar"></span></div>
      </div>
      <div id="word-zone" class="word-zone"></div>
      <form id="word-form" class="word-form" autocomplete="off">
        <input id="word-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Mot à taper" placeholder="Tapez un mot visible…">
      </form>
    </section>

    <div class="main-grid">
      <section class="panel" aria-labelledby="pull-title">
        <div class="section-heading">
          <div><p class="eyebrow">INVOCATION</p><h2 id="pull-title">Tirage</h2></div>
        </div>
        <div class="pull-buttons">
          <button id="pull-button" class="button button-cyan" type="button"></button>
          <button id="pull10-button" class="button" type="button"></button>
        </div>
        <p id="pull-info" class="muted"></p>
        <div id="pull-result" class="chips" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="fusion-title">
        <div class="section-heading">
          <div><p class="eyebrow">FUSION</p><h2 id="fusion-title">Combinaison</h2></div>
        </div>
        <div id="fusion-slots" class="fusion-slots"></div>
        <p id="fusion-info" class="muted"></p>
        <button id="fuse-button" class="button" type="button" disabled>FUSIONNER</button>
        <div id="fusion-result" class="chips" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="upgrade-title">
        <div class="section-heading">
          <div><p class="eyebrow">SYSTÈME</p><h2 id="upgrade-title">Améliorations</h2></div>
        </div>
        <p id="upgrade-empty" class="muted">Accumulez de l'Essence pour débloquer des améliorations.</p>
        <div id="upgrade-list" class="upgrade-list"></div>
      </section>
    </div>

    <section class="panel" aria-labelledby="bestiary-title">
      <div class="section-heading">
        <div><p class="eyebrow">COLLECTION</p><h2 id="bestiary-title">Bestiaire</h2></div>
        <span id="bestiary-count" class="section-count"></span>
      </div>
      <div id="bestiary-list" class="bestiary-list"></div>
    </section>

    <footer class="panel system-log">
      <span class="log-prefix">LOG &gt;</span>
      <p id="system-message" aria-live="polite"></p>
    </footer>
    <button id="reset-button" class="reset-button" type="button">REPRENDRE DE ZÉRO</button>
  </main>
</body>
</html>
